<title>こもれび村</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: full-bleed WebGL diorama; classic JRPG windows float over it at the edges */
:root{
  --ink:#fbf6e6;
  --win:#1b2d58;
  --win2:#0f1b3b;
  --frame:#f3e2b3;
  --edge:#16203d;
  --gold:#f4c95d;
  --hp:#7be08a;
  --danger:#ff8a70;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;overflow:hidden;background:#cdeedd;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.win{
  background:linear-gradient(180deg,var(--win) 0%,var(--win2) 100%);
  border:2px solid var(--frame);border-radius:8px;
  box-shadow:0 0 0 2px var(--edge),inset 0 0 0 1px rgba(255,255,255,.12),0 10px 28px rgba(10,24,40,.3);
  color:var(--ink);
}
#hud{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;
}
#quest{padding:8px 14px 9px;max-width:min(300px,62vw);font-size:13px;line-height:1.55}
.qt{font-size:11px;letter-spacing:.18em;color:var(--gold)}
#party{padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.hpbar{width:76px;height:6px;background:#0a1228;border:1px solid #3a4a78;border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .35s}
#help{
  position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  font-size:12px;letter-spacing:.05em;color:#fff;text-shadow:0 1px 0 rgba(20,40,40,.8),0 0 6px rgba(20,40,40,.5);pointer-events:none;
}
#help kbd{font-family:var(--font);border:1px solid rgba(255,255,255,.7);border-radius:4px;padding:0 5px;margin-right:4px;background:rgba(20,36,71,.35)}
#dialog{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(760px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  box-sizing:border-box;min-height:118px;padding:24px 26px 20px;font-size:18px;line-height:1.75;cursor:pointer;
}
#dname{
  position:absolute;top:-17px;left:18px;padding:2px 12px;font-size:14px;color:var(--gold);
  background:var(--win);border:2px solid var(--frame);border-radius:6px;box-shadow:0 0 0 2px var(--edge);
}
#dtext{margin:0;white-space:pre-wrap;min-height:3.5em}
#dnext{position:absolute;right:18px;bottom:10px;color:var(--gold);font-size:14px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s}
#banner.show{opacity:1}
#bannerSub{font-size:13px;letter-spacing:.45em;color:var(--gold);text-shadow:0 1px 0 #24365f,0 0 8px rgba(20,40,60,.6)}
#bannerMain{font-size:clamp(30px,6vw,52px);letter-spacing:.22em;color:#fffaf0;text-shadow:0 2px 0 #2a3f6b,0 0 18px rgba(255,236,170,.85)}
#bannerMain::after{content:"";display:block;margin:10px auto 0;width:min(320px,60%);height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#title{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(ellipse 60% 34% at 50% 48%,rgba(14,44,36,.5) 0%,rgba(14,44,36,.22) 70%,rgba(16,40,52,.4) 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .8s;
}
#title.out{opacity:0;pointer-events:none}
.logo-sub{font-size:13px;letter-spacing:.5em;color:#fff;text-shadow:0 1px 0 #2b5a3e,0 0 10px rgba(20,60,40,.6)}
.logo{
  margin:0;font-weight:400;font-size:clamp(46px,12vw,100px);letter-spacing:.14em;line-height:1.1;color:#fffdf4;text-wrap:balance;
  text-shadow:0 3px 0 #2b5a3e,0 7px 0 rgba(20,50,40,.3),0 0 34px rgba(255,240,180,.95);
}
.logo-en{font-size:12px;letter-spacing:.6em;color:var(--gold);text-shadow:0 1px 0 #2b5a3e}
#startBtn{
  margin-top:18px;font-family:var(--font);font-size:18px;letter-spacing:.25em;padding:10px 34px 10px 40px;cursor:pointer;
}
#startBtn:hover{border-color:#fff}
#startBtn:focus-visible,#bcmd button:focus-visible,#btnA:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.title-note{font-size:12px;color:#fff;opacity:.9;text-shadow:0 1px 0 rgba(20,40,40,.8)}
#battle{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(20,30,60,0) 0%,rgba(20,30,60,.5) 100%);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
#enemyWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#enemyName{font-size:16px;letter-spacing:.2em;text-shadow:0 2px 0 #1b2d58}
#enemyCv{width:200px;height:180px;image-rendering:pixelated;animation:hop 1.2s ease-in-out infinite;filter:drop-shadow(0 14px 0 rgba(10,30,50,.22))}
#enemyCv.hit{animation:hit .45s steps(2) 1}
#enemyCv.dead{animation:die .8s forwards}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-14px) scaleY(1.04)}80%{transform:translateY(0) scaleY(.92)}}
@keyframes hit{0%,100%{transform:translateX(0);filter:brightness(1)}25%{transform:translateX(-10px);filter:brightness(3)}75%{transform:translateX(10px);filter:brightness(3)}}
@keyframes die{to{transform:scale(1.4,0);opacity:0;filter:brightness(4)}}
.ehp{width:140px;height:6px;background:#0a1228;border:1px solid var(--frame);border-radius:3px;overflow:hidden}
.ehp i{display:block;height:100%;width:100%;background:var(--danger);transition:width .35s}
#bpanel{display:flex;gap:12px;width:min(760px,100%);flex-wrap:wrap}
#bcmd{display:flex;flex-direction:column;padding:10px 6px;min-width:150px;box-sizing:border-box}
#bcmd.off{opacity:.45;pointer-events:none}
#bcmd button{font-family:var(--font);font-size:17px;background:none;border:0;color:var(--ink);text-align:left;padding:7px 14px 7px 30px;position:relative;cursor:pointer;border-radius:4px}
#bcmd button.sel::before{content:"▶";position:absolute;left:9px;color:var(--gold);font-size:13px;top:10px}
#blog{flex:1;min-width:0;padding:14px 20px;font-size:17px;line-height:1.6;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
#blogText{margin:0;min-height:2.8em}
#bstat{font-size:14px;color:var(--gold);display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s linear 1}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#fade{position:fixed;inset:0;background:#0b1022;opacity:0;pointer-events:none;transition:opacity .5s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#stick{
  position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:124px;height:124px;border-radius:50%;background:rgba(20,36,71,.32);border:2px solid rgba(243,226,179,.65);touch-action:none;
}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(243,226,179,.88);box-shadow:0 2px 0 rgba(20,36,71,.4)}
#btnA{
  position:fixed;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));
  width:78px;height:78px;border-radius:50%;font-family:var(--font);font-size:24px;color:var(--ink);
  background:linear-gradient(180deg,var(--win),var(--win2));border:2px solid var(--frame);box-shadow:0 0 0 2px var(--edge);touch-action:none;
}
@media (max-width:520px){
  #bcmd{flex-direction:row;justify-content:space-around;width:100%;padding:6px}
  #bcmd button{padding:7px 10px 7px 26px;font-size:16px}
  #dialog{font-size:16px;padding:22px 18px 18px}
  #quest{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  #enemyCv,#dnext{animation:none}
  #banner,#title,#fade{transition:none}
}
</style>

<canvas id="stage" aria-label="ゲーム画面"></canvas>

<div id="hud" hidden>
  <div id="quest" class="win"><div class="qt">クエスト</div><div id="questText">村の人と 話してみよう</div></div>
  <div id="party" class="win"><span>ユウ</span><span class="hpbar"><i id="hpFill"></i></span><span id="hpNum">30/30</span></div>
</div>
<div id="help" hidden><kbd>WASD</kbd>/<kbd>矢印</kbd>いどう　<kbd>Space</kbd>はなす・すすむ</div>
<div id="banner"><div id="bannerSub"></div><div id="bannerMain"></div></div>

<div id="dialog" class="win" hidden><div id="dname" hidden></div><p id="dtext"></p><span id="dnext" hidden>▼</span></div>

<div id="battle" hidden>
  <div id="enemyWrap">
    <div id="enemyName">スライム</div>
    <canvas id="enemyCv" width="20" height="18"></canvas>
    <div class="ehp"><i id="ehpFill"></i></div>
  </div>
  <div id="bpanel">
    <div id="bcmd" class="win">
      <button id="cmdAttack" data-c="attack" class="sel">たたかう</button>
      <button id="cmdGuard" data-c="guard">まもる</button>
      <button id="cmdRun" data-c="run">にげる</button>
    </div>
    <div id="blog" class="win"><p id="blogText"></p><div id="bstat">ユウ <span class="hpbar"><i id="bhpFill"></i></span> HP <span id="bhp">30</span>/30</div></div>
  </div>
</div>

<div id="touch" hidden><div id="stick"><div id="knob"></div></div><button id="btnA" aria-label="はなす">A</button></div>

<div id="title">
  <div class="logo-sub">光と みどりの 小さな物語</div>
  <h1 class="logo">こもれび村</h1>
  <div class="logo-en">KOMOREBI VILLAGE</div>
  <button id="startBtn" class="win">はじめる</button>
  <div class="title-note">Enter / Space でも はじめられます</div>
</div>
<div id="flash"></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ---------- seeded random ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20261105);
const ri = (a,b) => a + Math.floor(rand()*(b-a+1));
const pick = a => a[Math.floor(rand()*a.length)];

/* ---------- pixel canvas helpers ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function px(x,X,Y,c){x.fillStyle=c;x.fillRect(X,Y,1,1);}
function rect(x,X,Y,w,h,c){x.fillStyle=c;x.fillRect(X,Y,w,h);}
function rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,f){const k=v=>Math.max(0,Math.min(255,Math.round(f>0?v+(255-v)*f:v*(1+f))));return'#'+rgb(h).map(k).map(v=>v.toString(16).padStart(2,'0')).join('');}
function outline(c,col){
  const x=c.getContext('2d'),w=c.width,h=c.height,img=x.getImageData(0,0,w,h),d=img.data,s=new Uint8ClampedArray(d),[r,g,b]=rgb(col);
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4;if(s[i+3]>0)continue;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const A=X+dx,B=y+dy;if(A<0||B<0||A>=w||B>=h)continue;
      if(s[(B*w+A)*4+3]>0){d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;break;}}}
  x.putImageData(img,0,0);return c;
}
function flipC(c){const f=cv(c.width,c.height),x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function toTex(c,rep){const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function softTex(c){const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;return t;}
function noiseTile(w,h,base,pal,dens){const c=cv(w,h),x=c.getContext('2d');rect(x,0,0,w,h,base);for(let i=0;i<w*h*dens;i++)px(x,ri(0,w-1),ri(0,h-1),pick(pal));return c;}

/* ---------- textures: ground ---------- */
function grassTex(fl){const c=noiseTile(16,16,'#6dbf4b',['#62b244','#79ca56','#86d462','#5aa83f'],.35),x=c.getContext('2d');
  for(let i=0;i<5;i++){const X=ri(0,15),Y=ri(1,15);px(x,X,Y,'#4f9a38');px(x,X,Y-1,'#97de70');}
  if(fl)for(let i=0;i<3;i++)px(x,ri(0,15),ri(0,15),pick(['#fff6c8','#ffd1e6','#ffffff']));return c;}
function fringe(x,w){for(let i=0;i<w;i++){const d=ri(2,4);rect(x,i,0,1,d,i%2?'#6dbf4b':'#5fb043');px(x,i,d,'#4f9a38');}}
function dirtSide(){const c=noiseTile(16,16,'#9a6a43',['#8a5b37','#a9784d','#7d5232','#b58756'],.4),x=c.getContext('2d');fringe(x,16);
  for(let i=0;i<3;i++){const X=ri(1,13),Y=ri(6,13);rect(x,X,Y,2,2,'#b7a28a');px(x,X,Y,'#d8c8b0');}return c;}
function cliffSide(){const c=cv(16,32),x=c.getContext('2d'),rows=['#a89786','#988775','#b3a28f','#8c7b6a'];
  for(let y=0;y<32;y++)for(let X=0;X<16;X++){let col=rows[Math.floor((y+Math.sin(X*.7)*1.5+8)/4)%4];if(rand()<.15)col=shade(col,rand()<.5?-.12:.1);px(x,X,y,col);}
  for(let i=0;i<5;i++){let X=ri(0,15),Y=ri(6,28);for(let k=0;k<4;k++){px(x,X,Y,'#6f6052');X=Math.max(0,Math.min(15,X+ri(-1,1)));Y++;}}
  fringe(x,16);
  for(let v=0;v<2;v++){let X=ri(1,14);const n=ri(6,16);for(let k=0;k<n;k++){px(x,X,3+k,'#4f9a38');if(rand()<.3)px(x,Math.min(15,X+1),3+k,'#79ca56');if(rand()<.25)X=Math.max(0,Math.min(15,X+ri(-1,1)));}}
  return c;}
function pathTex(){const c=noiseTile(16,16,'#dcbb80',['#d0ac6f','#e6c991','#c9a165','#efd6a4'],.4),x=c.getContext('2d');
  for(let i=0;i<3;i++){const X=ri(0,14),Y=ri(0,14);px(x,X,Y,'#b08a5a');px(x,X+1,Y,'#f6e5c0');}return c;}
function plankTex(){const c=cv(16,16),x=c.getContext('2d');for(let r=0;r<4;r++){const b=pick(['#a8703f','#b57b47','#9c6638']);
  rect(x,0,r*4,16,4,b);rect(x,0,r*4,16,1,shade(b,.18));rect(x,0,r*4+3,16,1,'#6e4423');for(let i=0;i<4;i++)px(x,ri(0,15),r*4+ri(1,2),shade(b,-.12));px(x,ri(2,13),r*4+1,'#5a3a20');}return c;}
function stoneTex(){const c=cv(16,16),x=c.getContext('2d');rect(x,0,0,16,16,'#8d8478');
  for(let r=0;r<4;r++){const off=(r%2)*4;for(let k=-1;k<3;k++){const col=pick(['#b9b0a2','#a89f91','#c7beb0']);rect(x,off+k*8+1,r*4+1,6,3,col);rect(x,off+k*8+1,r*4+1,6,1,shade(col,.14));}}return c;}
function roofTex(col){const c=cv(16,16),x=c.getContext('2d');for(let r=0;r<4;r++){rect(x,0,r*4,16,4,col);rect(x,0,r*4,16,1,shade(col,.22));rect(x,0,r*4+3,16,1,shade(col,-.38));
  const off=(r%2)*4;for(let k=0;k<2;k++)rect(x,(off+k*8)%16,r*4+1,1,2,shade(col,-.25));}return c;}
function wallTex(){const c=noiseTile(32,24,'#f3e7cc',['#eadcbc','#f8eedb','#e4d4b2'],.25),x=c.getContext('2d'),B='#7a4a2a',L='#94603a';
  rect(x,0,0,32,2,B);rect(x,0,22,32,2,B);rect(x,0,0,2,24,B);rect(x,30,0,2,24,B);rect(x,15,0,2,24,B);rect(x,0,11,32,2,B);
  for(let i=0;i<9;i++){px(x,2+i,2+i,B);px(x,3+i,2+i,L);px(x,29-i,13+i,B);px(x,28-i,13+i,L);}return c;}
function doorTex(){const c=cv(10,16),x=c.getContext('2d');rect(x,0,2,10,14,'#7a4a2a');rect(x,1,1,8,1,'#7a4a2a');rect(x,2,0,6,1,'#7a4a2a');
  rect(x,1,2,8,14,'#a9703f');rect(x,2,1,6,1,'#a9703f');for(let i=1;i<9;i+=3)rect(x,i,2,1,14,'#8e5c33');px(x,7,9,'#f4c95d');return c;}
function windowTex(){const c=cv(12,13),x=c.getContext('2d');rect(x,0,0,12,10,'#fdf6e3');rect(x,1,1,10,8,'#8fcbe8');rect(x,1,1,10,3,'#b9e2f4');
  rect(x,5,1,2,8,'#fdf6e3');rect(x,1,4,10,1,'#fdf6e3');px(x,2,2,'#ffffff');px(x,8,2,'#ffffff');
  rect(x,0,10,12,3,'#9c6638');for(let i=1;i<11;i+=2)px(x,i,9,pick(['#ff7a8a','#ffd25a','#ffffff']));return c;}

/* ---------- textures: sprites ---------- */
function treeTex(kind){const W=34,H=44,c=cv(W,H),x=c.getContext('2d');
  const tk=['#7a4f2e','#95653c','#5e3b22'];
  for(let y=27;y<42;y++){const w=y>38?8:6,x0=17-w/2;for(let i=0;i<w;i++)px(x,x0+i,y,i<2?tk[1]:i>=w-2?tk[2]:tk[0]);}
  const blobs=kind==='round'?[[17,14,12],[10,20,8],[24,20,8],[17,23,9],[12,10,6],[22,10,6]]:[[17,13,11],[9,19,8],[25,19,8],[17,22,9],[13,8,6],[22,9,6]];
  const pal=kind==='blossom'?['#fff0f6','#f9c8dc','#f09cbf','#d0739a','#a3527a']:kind==='round'?['#d6f59a','#a3e067','#6fbe4c','#46953d','#2f6f33']:['#c4ef8a','#8fd65e','#62b447','#3f8e3a','#2d6c31'];
  const bay=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  for(let y=0;y<H;y++)for(let X=0;X<W;X++){let best=-9,ins=false;
    for(const[bx,by,r]of blobs){const dx=X-bx,dy=y-by,d=Math.hypot(dx,dy);if(d<r){ins=true;const l=(-dx*.55-dy*.8)/r*.9+(1-d/r)*.4;if(l>best)best=l;}}
    if(!ins)continue;let v=best-(y/H)*.5+.3+(bay[(y%4)*4+X%4]/16-.5)*.25;
    px(x,X,y,pal[v>.75?0:v>.45?1:v>.15?2:v>-.15?3:4]);}

  if(KMAP[e.code]){keys.add(KMAP[e.code]);e.preventDefault();
    if(bt.active&&!bt.busy){if(KMAP[e.code]==='u'||KMAP[e.code]==='l')selCmd(bt.sel-1);if(KMAP[e.code]==='d'||KMAP[e.code]==='r')selCmd(bt.sel+1);}}
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'){e.preventDefault();if(!e.repeat)action();}
});
addEventListener('keyup',e=>{if(KMAP[e.code])keys.delete(KMAP[e.code]);});
addEventListener('blur',()=>keys.clear());
function action(){
  if(game.state==='title')return startGame();
  if(dlg.active)return advance();
  if(bt.active){if(!bt.busy)doCmd(cmdBtns[bt.sel].dataset.c);return;}
  if(near)talk(near);
}
const stick={x:0,z:0,id:null};
const stickEl=$('stick'),knob=$('knob');
stickEl.addEventListener('pointerdown',e=>{stick.id=e.pointerId;stickEl.setPointerCapture(e.pointerId);moveStick(e);});
stickEl.addEventListener('pointermove',e=>{if(e.pointerId===stick.id)moveStick(e);});
const endStick=e=>{if(e.pointerId!==stick.id)return;stick.id=null;stick.x=stick.z=0;knob.style.transform='';};
stickEl.addEventListener('pointerup',endStick);stickEl.addEventListener('pointercancel',endStick);
function moveStick(e){const r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dz=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dz),m=46,k=l>m?m/l:1;
  knob.style.transform=`translate(${dx*k}px,${dz*k}px)`;const n=Math.min(1,l/m);stick.x=l>6?dx/l*n:0;stick.z=l>6?dz/l*n:0;}
$('btnA').addEventListener('pointerdown',e=>{e.preventDefault();action();});
const coarse=matchMedia('(pointer:coarse)').matches;
function syncTouch(){const playing=game.state==='play';$('touch').hidden=!(coarse&&playing&&!dlg.active&&!bt.active);$('help').hidden=coarse||!playing;}
$('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame();});

/* ---------- movement ---------- */
const PR=.27;
function freeAt(x,z){
  for(const[a,b]of[[-PR,-PR*.6],[PR,-PR*.6],[-PR,PR*.6],[PR,PR*.6]])if(blockedTile(Math.floor(x+a),Math.floor(z+b)))return false;
  for(const n of npcs)if(Math.hypot(n.x-x,n.z-z)<.55)return false;
  return true;
}
function tryMove(dx,dz){if(freeAt(player.x+dx,player.z))player.x+=dx;if(freeAt(player.x,player.z+dz))player.z+=dz;}
let near=null;
function updatePlayer(dt){
  let ix=(keys.has('r')?1:0)-(keys.has('l')?1:0)+stick.x,iz=(keys.has('d')?1:0)-(keys.has('u')?1:0)+stick.z;
  const l=Math.hypot(ix,iz);const moving=l>.1&&game.state==='play'&&!dlg.active&&!bt.active;
  if(moving){const s=3.4*Math.min(1,l)/l*dt;tryMove(ix*s,iz*s);player.dir=dirTo(ix,iz);player.anim+=dt*8;}else player.anim=0;
  const f=moving?[1,0,2,0][Math.floor(player.anim)%4]:0;
  player.ch.set(player.dir,f);player.ch.g.position.set(player.x,0,player.z);player.ch.mesh.position.y=moving&&f!==0?.04:0;
  if(game.state!=='play')return;
  // interactions
  near=null;let best=1.25;
  for(const n of[...npcs,signObj]){const d=Math.hypot(n.x-player.x,n.z-player.z);if(d<best){best=d;near=n;}}
  // herbs
  for(const h of herbs){if(!h.got&&Math.hypot(h.x-player.x,h.z-player.z)<.6){h.got=true;h.m.visible=h.glow.visible=false;game.herbs++;updQuest();
    say([{t:`ひかり草を 手に入れた！（${game.herbs} / 3）`}].concat(game.herbs===3?[{t:'これで 3つ そろった。\n村に もどって とどけよう。'}]:[]));}}
  // area
  if(!game.visitedMeadow&&player.x>23.5){game.visitedMeadow=true;banner('ひかりの草原','EAST MEADOW');}
  // slime contact
  if(!slime.dead&&slime.cool<=0&&!dlg.active&&!bt.active&&Math.hypot(slime.x-player.x,slime.z-player.z)<.62)startBattle();
}
function updateNPCs(dt){
  npcs.forEach(n=>{n.t-=dt;
    if(dlg.active&&near===n)n.dir=dirTo(player.x-n.x,player.z-n.z);
    else if(n.t<=0){n.t=2.5+rand()*4;n.dir=pick(['d','d','l','r','d']);}
    n.ch.set(n.dir,0);n.ch.g.position.set(n.x,0,n.z);n.ch.mesh.scale.y=1+Math.sin(time*2.4+n.x)*.015;});
}
function updateSlime(dt){
  if(slime.dead)return;slime.t+=dt;slime.cool-=dt;
  const dP=Math.hypot(player.x-slime.x,player.z-slime.z);
  if(game.state==='play'&&!dlg.active&&!bt.active){
    let tx=slime.tx,tz=slime.tz;
    if(dP<3.2&&slime.cool<=0){tx=player.x;tz=player.z;}
    else if(Math.hypot(tx-slime.x,tz-slime.z)<.2){slime.tx=slime.home[0]+(Math.random()-.5)*3;slime.tz=slime.home[1]+(Math.random()-.5)*3;}
    const dx=tx-slime.x,dz=tz-slime.z,l=Math.hypot(dx,dz);
    if(l>.05){const s=(dP<3.2?1.25:.6)*dt;const nx=slime.x+dx/l*s,nz=slime.z+dz/l*s;if(!blockedTile(Math.floor(nx),Math.floor(nz))){slime.x=nx;slime.z=nz;}else{slime.tx=slime.home[0];slime.tz=slime.home[1];}}
  }
  const f=Math.floor(slime.t*3)%2;slime.mat.map=slimeT[f];slime.dm.map=slimeT[f];
  slime.g.position.set(slime.x,0,slime.z);slime.m.position.y=Math.abs(Math.sin(slime.t*4.7))*.12;
}

/* ---------- camera ---------- */
const camT=new THREE.Vector3(11.5,0,13.5),camOff=new THREE.Vector3(0,10.6,11.2);
function desiredTarget(){if(game.state==='title')return new THREE.Vector3(12.5+Math.sin(time*.12)*3.5,0,12.2+Math.cos(time*.09)*1.2);return new THREE.Vector3(player.x,0,player.z);}
function camScale(){const a=camera.aspect;return a<1?Math.min(1.75,1/Math.pow(a,.55)):1;}
function snapCam(){camT.copy(desiredTarget());placeCam();}
const tmpV=new THREE.Vector3();
function placeCam(){
  camera.position.copy(camT).addScaledVector(camOff,camScale());camera.lookAt(camT.x,camT.y+.6,camT.z);
  sun.position.copy(camT).add(SUN_OFF);sun.target.position.copy(camT);sun.target.updateMatrixWorld();
  camera.updateMatrixWorld();tmpV.set(camT.x,.7,camT.z).applyMatrix4(camera.matrixWorldInverse);compMat.uniforms.uFocus.value=-tmpV.z;
  cutU.uPZ.value=-tmpV.z;tmpV.set(camT.x,.7,camT.z).project(camera);cutU.uPS.value.set(tmpV.x*.5+.5,tmpV.y*.5+.5);cutU.uRes.value.set(sw,sh);
}

/* ---------- main loop ---------- */
let time=0,last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;timeU.value=time;
  updatePlayer(dt);updateNPCs(dt);updateSlime(dt);
  if(dlg.typing){dlg.shown=Math.min(dlg.full.length,dlg.shown+dt*42);ui.dtext.textContent=dlg.full.slice(0,Math.floor(dlg.shown));if(dlg.shown>=dlg.full.length){dlg.typing=false;ui.dnext.hidden=false;}}
  herbs.forEach((h,i)=>{if(h.got)return;h.m.position.y=Math.sin(time*2+i)*.05;h.glow.material.opacity=.55+Math.sin(time*3+i)*.25;});
  bubble.visible=!!near&&!dlg.active&&!bt.active&&game.state==='play';
  if(bubble.visible){bubble.position.set(near.x+.25,(near.id==='sign'?1.05:near.id==='riko'?1.35:1.55)+Math.sin(time*4)*.04,near.z);}
  {const p=motes.pos;for(let i=0;i<motes.n;i++){const s=motes.seed[i];p[i*3]+=Math.sin(time*.5+s)*.004;p[i*3+1]+=Math.cos(time*.7+s*2)*.003+.0015;p[i*3+2]+=Math.cos(time*.4+s)*.003;if(p[i*3+1]>3.6)p[i*3+1]=.2;}motes.p.geometry.attributes.position.needsUpdate=true;}
  shafts.forEach(s=>s.m.material.opacity=.13+Math.sin(time*.6+s.ph)*.07);
  bflies.forEach(b=>{const t=time*b.sp+b.ph;b.m.position.set(b.home[0]+Math.sin(t*.9)*1.6,.55+Math.sin(t*3.1)*.25+Math.sin(t*.7)*.2,b.home[1]+Math.sin(t*1.3)*1.1);b.m.material.map=b.t[Math.floor(time*9+b.ph)%2];});
  smoke.forEach(s=>{s.life+=dt*.22;if(s.life>1)s.life-=1;const l=s.life;s.sp.position.set(s.s.x+Math.sin(l*4+s.s.z)*.25+l*.6,s.s.y+l*2.2,s.s.z);const k=.35+l*1.1;s.sp.scale.set(k,k,1);s.sp.material.opacity=Math.sin(l*Math.PI)*.45;});
  camT.lerp(desiredTarget(),1-Math.exp(-dt*(game.state==='title'?1.5:5)));placeCam();
  extraBlur+=(extraTarget-extraBlur)*(1-Math.exp(-dt*6));compMat.uniforms.uExtra.value=extraBlur;
  render();
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
function startGame(){
  if(game.state!=='title')return;game.state='play';
  $('title').classList.add('out');setTimeout(()=>{$('title').hidden=true;},800);
  ui.hud.hidden=false;syncTouch();updQuest();updHP();
  setTimeout(()=>banner('こもれび村','KOMOREBI VILLAGE'),400);
  setTimeout(()=>{if(!dlg.active&&!bt.active)say([{n:'ユウ',t:'ここが こもれび村か…。\n光が やわらかくて、いいところだな。'},{t:'（村の人に 近づいて Space か A で 話しかけてみよう）'}]);},3200);
}
function boot(data){
  data=data||{};
  if(data.started){game.state='title';startGame();
    Object.assign(game,{quest:data.quest|0,herbs:data.herbs|0,visitedMeadow:!!data.meadow});
    if(Array.isArray(data.p)){player.x=data.p[0];player.z=data.p[1];}
    if(data.hp)player.hp=data.hp;
    (data.got||[]).forEach((g,i)=>{if(g&&herbs[i]){herbs[i].got=true;herbs[i].m.visible=herbs[i].glow.visible=false;}});
    if(data.slimeDead){slime.dead=true;slime.g.visible=false;}
    updQuest();updHP();}
  snapCam();updHP();requestAnimationFrame(t=>{last=t;frame(t);});
}
window.claude?.hot?.snapshot?.(()=>({started:game.state==='play',quest:game.quest,herbs:game.herbs,meadow:game.visitedMeadow,p:[player.x,player.z],hp:player.hp,got:herbs.map(h=>h.got),slimeDead:slime.dead}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
